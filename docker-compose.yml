# Postgres for agent runs. scripts/run.sh resets it before every run.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omission
      POSTGRES_PASSWORD: omission
      POSTGRES_DB: omission
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omission -d omission"]
      interval: 1s
      timeout: 3s
      retries: 30
